<!DOCTYPE html>
<html lang="ru-KZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Страница не найдена | Kairat Security</title>
<link rel="icon" href="/assets/logo.webp" type="image/webp">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    color: #fff;
    background: #101010;
    font-family: Arial, sans-serif;
  }
  main {
    width: min(100%, 680px);
    text-align: center;
  }
  .code {
    margin-bottom: 12px;
    color: #eb3636;
    font-size: clamp(72px, 18vw, 160px);
    font-weight: 700;
    line-height: .85;
  }
  h1 {
    margin-bottom: 16px;
    font-size: clamp(32px, 7vw, 56px);
    line-height: 1;
    text-transform: uppercase;
  }
  p {
    max-width: 520px;
    margin: 0 auto 32px;
    color: #b3b3b3;
    font-size: 18px;
    line-height: 1.5;
  }
  a {
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 28px;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, .45);
    border-radius: 999px;
    text-decoration: none;
    text-transform: uppercase;
    transition: border-color .2s, background-color .2s;
  }
  a:hover,
  a:focus-visible {
    border-color: #eb3636;
    background: #eb3636;
  }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Страница не найдена</h1>
  <p>Возможно, адрес изменился или страница была удалена. Вернитесь на главную страницу Kairat Security.</p>
  <a href="/">Вернуться на главную</a>
</main>
</body>
</html>
